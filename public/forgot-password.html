<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – ProofDesk</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 10%, rgba(99, 91, 255, 0.08) 0%, transparent 60%), var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .brand-logo {
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .alert-success {
      background-color: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success);
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="display: flex; justify-content: center; margin-bottom: 16px;">
        <img src="assets/images/logo.png" alt="ProofDesk" style="height: 44px; max-width: 200px; object-fit: contain;">
      </a>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">We will send a secure password reset link to your email</p>
    </div>

    <div id="authAlert" class="alert-box"></div>

    <form id="forgotForm" onsubmit="handleForgot(event)">
      <div class="form-group">
        <label class="form-label" for="email">Account Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
        <span id="btnText">Send Reset Link</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-secondary);">
      Remember your password?
      <a href="login.html" style="font-weight: 600; color: var(--primary);">Return to sign in</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    lucide.createIcons();

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const redirect_url = window.location.origin + '/login.html';
        await API.post('/auth/forgot-password', { email, redirect_url });
        alertBox.className = 'alert-box alert-success';
        alertBox.textContent = 'Password reset instructions have been sent to your email address.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      } catch (err) {
        alertBox.className = 'alert-box alert-error';
        alertBox.textContent = err.message || 'Failed to send reset link.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
