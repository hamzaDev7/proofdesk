<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices & Billing – ProofDesk</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableInvoiceModal, #printableInvoiceModal * { visibility: visible; }
      #printableInvoiceModal { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; border: none; }
      .no-print { display: none !important; }
      img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="topbar-mount"></div>

      <div class="page-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;">Invoices</h1>
            <p style="font-size: 13.5px; color: var(--text-muted);">Itemized milestone billing, payment statuses, and printable statements</p>
          </div>
          <button class="btn btn-primary" onclick="openNewInvoiceModal()">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Create Invoice
          </button>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Client</th>
                <th>Project</th>
                <th>Subtotal</th>
                <th>Tax</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th>Due Date</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="invoicesTableBody">
              <tr>
                <td colspan="9" style="text-align: center; color: var(--text-muted); padding: 40px;">
                  Loading invoices...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Invoice Modal -->
  <div class="modal-backdrop" id="invoiceModal">
    <div class="modal-dialog" style="max-width: 720px;">
      <div class="modal-header">
        <div class="modal-title">Create New Invoice</div>
        <button class="btn btn-icon btn-outline btn-sm" onclick="UI.closeModal('invoiceModal')">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
      <form id="invoiceForm" onsubmit="handleSaveInvoice(event)">
        <div class="modal-body">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="invoiceClient">Client *</label>
              <select id="invoiceClient" class="form-select" required>
                <option value="">-- Choose client --</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="invoiceProject">Associated Project</label>
              <select id="invoiceProject" class="form-select">
                <option value="">-- No Project (General Invoice) --</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="invoiceNumber">Invoice Number *</label>
              <input type="text" id="invoiceNumber" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="invoiceStatus">Status</label>
              <select id="invoiceStatus" class="form-select">
                <option value="draft">Draft</option>
                <option value="sent" selected>Sent</option>
                <option value="paid">Paid</option>
                <option value="overdue">Overdue</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="invoiceDueDate">Due Date</label>
              <input type="date" id="invoiceDueDate" class="form-control">
            </div>
          </div>

          <!-- Line items builder -->
          <div style="margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label class="form-label" style="margin-bottom: 0;">Itemized Services & Deliverables</label>
              <button type="button" class="btn btn-outline btn-sm" onclick="addInvoiceLineItem()">
                <i data-lucide="plus" style="width: 13px; height: 13px;"></i> Add Line Item
              </button>
            </div>

            <div id="invoiceItemsContainer" style="display: flex; flex-direction: column; gap: 10px;">
              <!-- Dynamic line items -->
            </div>
          </div>

          <div style="background: var(--surface-alt); padding: 16px; border-radius: var(--radius-md); text-align: right;">
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">
              Subtotal: <span style="font-weight: 700; color: var(--text-main);" id="calcSubtotal">$0.00</span>
            </div>
            <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">
              Tax (8%): <span style="font-weight: 700; color: var(--text-main);" id="calcTax">$0.00</span>
            </div>
            <div style="font-size: 18px; font-weight: 800; color: var(--primary);">
              Total: <span id="calcTotal">$0.00</span>
            </div>
          </div>

          <div class="form-group" style="margin-top: 16px;">
            <label class="form-label" for="invoiceNotes">Notes / Payment Terms</label>
            <textarea id="invoiceNotes" class="form-textarea" placeholder="Payment due within 14 days via wire transfer or ACH. Thank you for your business!"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="UI.closeModal('invoiceModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Generate Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Printable Invoice Document Modal -->
  <div class="modal-backdrop" id="printableInvoiceModal">
    <div class="modal-dialog" style="max-width: 800px; background: #fff; color: #111;">
      <div class="modal-header no-print">
        <div class="modal-title">Invoice Statement</div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-primary btn-sm" onclick="window.print()">
            <i data-lucide="printer" style="width: 14px; height: 14px;"></i> Print / Save PDF
          </button>
          <button class="btn btn-icon btn-outline btn-sm" onclick="UI.closeModal('printableInvoiceModal')">
            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>
      <div class="modal-body" id="invoiceDocumentBody" style="padding: 40px; font-family: sans-serif;">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    Auth.requireAuth();

    let allInvoices = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await UI.renderLayout('invoices');
      document.getElementById('pageTitleHeading').textContent = 'Invoices';
      await loadClientsAndProjects();
      await loadInvoices();
    });

    async function loadClientsAndProjects() {
      try {
        const [cRes, pRes] = await Promise.all([API.get('/clients'), API.get('/projects')]);
        const clientSel = document.getElementById('invoiceClient');
        const projSel = document.getElementById('invoiceProject');

        clientSel.innerHTML = '<option value="">-- Choose client --</option>' +
          (cRes.data || []).map(c => `<option value="${c.id}">${c.name} (${c.company || c.email})</option>`).join('');

        projSel.innerHTML = '<option value="">-- No Project (General Invoice) --</option>' +
          (pRes.data || []).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      } catch (err) {
        console.error('Failed to load selects:', err);
      }
    }

    async function loadInvoices() {
      try {
        const res = await API.get('/invoices');
        allInvoices = res.data || [];
        renderInvoicesTable(allInvoices);
      } catch (err) {
        console.error('Failed to load invoices:', err);
        UI.toast('Failed to load invoices: ' + err.message, 'error');
      }
    }

    function renderInvoicesTable(invoices) {
      const tbody = document.getElementById('invoicesTableBody');
      if (invoices.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9">
              <div class="empty-state">
                <div class="empty-state-icon"><i data-lucide="receipt"></i></div>
                <div class="empty-state-title">No invoices issued</div>
                <div class="empty-state-desc">Bill clients for completed project deliverables and milestones.</div>
                <button class="btn btn-primary" onclick="openNewInvoiceModal()">Create Invoice</button>
              </div>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = invoices.map(inv => {
        const clientName = inv.clients ? inv.clients.name : 'Unknown';
        const projName = inv.projects ? inv.projects.name : 'General Billing';

        return `
          <tr>
            <td><strong>${inv.invoice_number}</strong></td>
            <td>${clientName}</td>
            <td><span style="font-size: 12.5px; color: var(--text-secondary);">${projName}</span></td>
            <td>${UI.formatCurrency(inv.subtotal)}</td>
            <td>${UI.formatCurrency(inv.tax)}</td>
            <td style="font-weight: 700; color: var(--primary);">${UI.formatCurrency(inv.total)}</td>
            <td>
              <select class="form-select form-select-sm" style="width: auto; padding: 4px 8px; font-size: 12px; font-weight: 600;" onchange="changeInvoiceStatus('${inv.id}', this.value)" title="Change Status">
                <option value="draft" ${inv.status === 'draft' ? 'selected' : ''}>Draft</option>
                <option value="sent" ${inv.status === 'sent' ? 'selected' : ''}>Sent</option>
                <option value="paid" ${inv.status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="overdue" ${inv.status === 'overdue' ? 'selected' : ''}>Overdue</option>
                <option value="cancelled" ${inv.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
            <td>${UI.formatDate(inv.due_date)}</td>
            <td style="text-align: right;">
              <div style="display: inline-flex; gap: 6px;">
                <button class="btn btn-outline btn-sm" onclick="viewPrintableInvoice('${inv.id}')" title="View / Print Receipt">
                  <i data-lucide="printer" style="width: 14px; height: 14px;"></i> View Receipt
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    function openNewInvoiceModal() {
      document.getElementById('invoiceForm').reset();
      document.getElementById('invoiceNumber').value = 'INV-' + new Date().getFullYear() + '-' + Math.floor(100 + Math.random() * 900);
      
      const container = document.getElementById('invoiceItemsContainer');
      container.innerHTML = '';
      addInvoiceLineItem('Brand Discovery & Creative Strategy', 1, 3500);
      addInvoiceLineItem('Vector Logo Suite & Guidelines', 1, 4000);
      recalcInvoiceTotals();

      UI.openModal('invoiceModal');
    }

    function addInvoiceLineItem(desc = '', qty = 1, price = 0) {
      const container = document.getElementById('invoiceItemsContainer');
      const row = document.createElement('div');
      row.className = 'line-item-row';
      row.style.display = 'grid';
      row.style.gridTemplateColumns = '3fr 1fr 1.5fr 36px';
      row.style.gap = '10px';
      row.style.alignItems = 'center';

      row.innerHTML = `
        <input type="text" class="form-control item-desc" placeholder="Service description" value="${desc}" required oninput="recalcInvoiceTotals()">
        <input type="number" step="0.5" class="form-control item-qty" placeholder="Qty" value="${qty}" required oninput="recalcInvoiceTotals()">
        <input type="number" step="0.01" class="form-control item-price" placeholder="Price ($)" value="${price}" required oninput="recalcInvoiceTotals()">
        <button type="button" class="btn btn-icon btn-outline btn-sm" onclick="this.parentElement.remove(); recalcInvoiceTotals();">
          <i data-lucide="trash" style="width: 14px; height: 14px; color: var(--danger);"></i>
        </button>
      `;

      container.appendChild(row);
      lucide.createIcons({ root: row });
      recalcInvoiceTotals();
    }

    function recalcInvoiceTotals() {
      let subtotal = 0;
      const rows = document.querySelectorAll('.line-item-row');
      rows.forEach(r => {
        const qty = parseFloat(r.querySelector('.item-qty').value) || 0;
        const price = parseFloat(r.querySelector('.item-price').value) || 0;
        subtotal += (qty * price);
      });

      const tax = Math.round(subtotal * 0.08 * 100) / 100;
      const total = Math.round((subtotal + tax) * 100) / 100;

      document.getElementById('calcSubtotal').textContent = UI.formatCurrency(subtotal);
      document.getElementById('calcTax').textContent = UI.formatCurrency(tax);
      document.getElementById('calcTotal').textContent = UI.formatCurrency(total);
    }

    async function handleSaveInvoice(e) {
      e.preventDefault();
      const rows = document.querySelectorAll('.line-item-row');
      const items = [];

      rows.forEach(r => {
        items.push({
          description: r.querySelector('.item-desc').value.trim(),
          quantity: parseFloat(r.querySelector('.item-qty').value) || 1,
          unit_price: parseFloat(r.querySelector('.item-price').value) || 0
        });
      });

      if (items.length === 0) {
        UI.toast('Please add at least one line item', 'error');
        return;
      }

      const data = {
        client_id: document.getElementById('invoiceClient').value,
        project_id: document.getElementById('invoiceProject').value || null,
        invoice_number: document.getElementById('invoiceNumber').value.trim(),
        status: document.getElementById('invoiceStatus').value,
        due_date: document.getElementById('invoiceDueDate').value || null,
        notes: document.getElementById('invoiceNotes').value.trim(),
        tax_rate: 0.08,
        items
      };

      try {
        await API.post('/invoices', data);
        UI.toast('Invoice created successfully', 'success');
        UI.closeModal('invoiceModal');
        await loadInvoices();
      } catch (err) {
        UI.toast('Failed to create invoice: ' + err.message, 'error');
      }
    }

    async function markPaid(id) {
      await changeInvoiceStatus(id, 'paid');
    }

    async function changeInvoiceStatus(id, newStatus) {
      try {
        await API.put(`/invoices/${id}`, { status: newStatus });
        UI.toast(`Invoice status updated to ${newStatus.toUpperCase()}`, 'success');
        await loadInvoices();
      } catch (err) {
        UI.toast('Failed to update invoice status: ' + err.message, 'error');
        await loadInvoices();
      }
    }

    async function updateInvoiceStatusFromModal(id) {
      const select = document.getElementById('modalInvoiceStatus');
      if (!select) return;
      const newStatus = select.value;
      await changeInvoiceStatus(id, newStatus);
      await viewPrintableInvoice(id);
    }

    async function viewPrintableInvoice(id) {
      try {
        const res = await API.get(`/invoices/${id}`);
        const inv = res.data;
        const c = inv.clients || {};
        const items = inv.invoice_items || [];

        const html = `
          <!-- Interactive Status Bar (Hidden during printing) -->
          <div class="no-print" style="margin-bottom: 24px; padding: 12px 18px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-weight: 700; font-size: 13px; color: #1E293B;">Change Invoice Status:</span>
              <select id="modalInvoiceStatus" class="form-select form-select-sm" style="width: 140px; font-weight: 600; padding: 4px 10px;">
                <option value="draft" ${inv.status === 'draft' ? 'selected' : ''}>Draft</option>
                <option value="sent" ${inv.status === 'sent' ? 'selected' : ''}>Sent</option>
                <option value="paid" ${inv.status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="overdue" ${inv.status === 'overdue' ? 'selected' : ''}>Overdue</option>
                <option value="cancelled" ${inv.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
              <button type="button" class="btn btn-primary btn-sm" onclick="updateInvoiceStatusFromModal('${inv.id}')">
                <i data-lucide="check" style="width: 13px; height: 13px;"></i> Save Status
              </button>
            </div>
            <div style="font-size: 12px; color: #64748B;">
              Current Status: <strong>${(inv.status || 'DRAFT').toUpperCase()}</strong>
            </div>
          </div>

          <!-- Printable Receipt Header with System Logo -->
          <div class="receipt-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 2px solid #E2E8F0; padding-bottom: 20px;">
            <div>
              <img src="assets/images/logo.png" alt="ProofDesk" style="height: 52px; max-width: 230px; object-fit: contain; margin-bottom: 6px; display: block;">
              <div style="font-size: 12px; color: #64748B; font-weight: 500;">ProofDesk Official Billing & Deliverables SaaS</div>
            </div>
            <div style="text-align: right;">
              <h2 style="font-size: 24px; font-weight: 800; margin: 0; color: #0F172A; letter-spacing: -0.5px;">INVOICE RECEIPT</h2>
              <div style="font-size: 14px; font-weight: 700; color: #635BFF; margin-top: 4px;">${inv.invoice_number}</div>
              <div style="font-size: 12px; color: #64748B;">Date: ${UI.formatDate(inv.created_at)}</div>
              <div style="font-size: 12px; color: #64748B;">Due: ${UI.formatDate(inv.due_date)}</div>
            </div>
          </div>

          <div class="receipt-meta" style="display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 13px;">
            <div>
              <div style="font-weight: 700; text-transform: uppercase; color: #94A3B8; font-size: 11px; margin-bottom: 6px;">Billed To:</div>
              <div style="font-weight: 700; font-size: 15px; color: #0F172A;">${c.name || 'Client'}</div>
              <div>${c.company || ''}</div>
              <div>${c.email || ''}</div>
              <div>${c.address || ''}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: 700; text-transform: uppercase; color: #94A3B8; font-size: 11px; margin-bottom: 6px;">Status:</div>
              <div>${UI.renderStatusBadge(inv.status)}</div>
            </div>
          </div>

          <div class="table-container" style="border: none; border-radius: 0; margin-bottom: 30px;">
            <table style="width: 100%; min-width: 420px; border-collapse: collapse;">
              <thead>
                <tr style="border-bottom: 2px solid #E2E8F0; text-align: left; font-size: 12px; color: #64748B;">
                  <th style="padding: 10px 0;">Description</th>
                  <th style="padding: 10px; text-align: center;">Qty</th>
                  <th style="padding: 10px; text-align: right;">Unit Price</th>
                  <th style="padding: 10px 0; text-align: right;">Amount</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(it => `
                  <tr style="border-bottom: 1px solid #F1F5F9; font-size: 13px;">
                    <td style="padding: 12px 0;">${it.description}</td>
                    <td style="padding: 12px; text-align: center;">${it.quantity}</td>
                    <td style="padding: 12px; text-align: right;">${UI.formatCurrency(it.unit_price)}</td>
                    <td style="padding: 12px 0; text-align: right; font-weight: 600;">${UI.formatCurrency(it.total)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
            <div style="width: 260px; font-size: 13px;">
              <div style="display: flex; justify-content: space-between; padding: 6px 0; color: #64748B;">
                <span>Subtotal:</span>
                <span style="font-weight: 600; color: #0F172A;">${UI.formatCurrency(inv.subtotal)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; padding: 6px 0; color: #64748B;">
                <span>Tax:</span>
                <span style="font-weight: 600; color: #0F172A;">${UI.formatCurrency(inv.tax)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 2px solid #E2E8F0; font-size: 16px; font-weight: 800; color: #635BFF;">
                <span>Total Due:</span>
                <span>${UI.formatCurrency(inv.total)}</span>
              </div>
            </div>
          </div>

          ${inv.notes ? `
          <div style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 14px; border-radius: 6px; font-size: 12px; color: #475569;">
            <strong>Notes & Payment Instructions:</strong><br>
            ${inv.notes}
          </div>
          ` : ''}
        `;

        document.getElementById('invoiceDocumentBody').innerHTML = html;
        lucide.createIcons();
        UI.openModal('printableInvoiceModal');
      } catch (err) {
        UI.toast('Failed to load invoice details: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
