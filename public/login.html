<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – ProofDesk</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 10%, rgba(99, 91, 255, 0.08) 0%, transparent 60%), var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .brand-logo {
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .alert-error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="display: flex; justify-content: center; margin-bottom: 16px;">
        <img src="assets/images/logo.png" alt="ProofDesk" style="height: 44px; max-width: 200px; object-fit: contain;">
      </a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Enter your credentials to access your workspace</p>
    </div>

    <div id="authAlert" class="alert-error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a href="forgot-password.html" style="font-size: 12px; color: var(--primary);">Forgot password?</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
        <span id="btnText">Sign In to ProofDesk</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-secondary);">
      Don't have a workspace yet?
      <a href="register.html" style="font-weight: 600; color: var(--primary);">Sign up</a>
    </div>

    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
      <button class="btn btn-icon btn-outline btn-sm" onclick="UI.toggleTheme()" title="Toggle Theme" style="margin: 0 auto;">
        <i data-lucide="moon" style="width: 15px; height: 15px;"></i>
      </button>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    lucide.createIcons();

    // If user is already authenticated, redirect to dashboard
    if (Auth.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.data) {
          Auth.saveSession(res.data);
          UI.toast('Signed in successfully', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
