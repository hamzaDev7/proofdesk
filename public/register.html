<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Workspace – ProofDesk</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      background: radial-gradient(circle at 50% 10%, rgba(99, 91, 255, 0.08) 0%, transparent 60%), var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .brand-logo {
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .alert-error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="display: flex; justify-content: center; margin-bottom: 16px;">
        <img src="assets/images/logo.png" alt="ProofDesk" style="height: 44px; max-width: 200px; object-fit: contain;">
      </a>
      <h1 class="auth-title">Create your workspace</h1>
      <p class="auth-subtitle">Get started with ProofDesk in less than 2 minutes</p>
    </div>

    <div id="authAlert" class="alert-error"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Alex Morgan" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-control" placeholder="alex@agency.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="workspaceName">Workspace / Agency Name</label>
        <input type="text" id="workspaceName" class="form-control" placeholder="Acme Creative Studio" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Account Role</label>
        <select id="role" class="form-select">
          <option value="workspace_owner" selected>Workspace Owner (Agencies, Freelancers, Teams)</option>
          <option value="workspace_member">Workspace Member (Staff, Designers, Developers)</option>
          <option value="client">Client (Approver / Stakeholder)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min. 8 characters)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
        <span id="btnText">Create Account & Workspace</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-secondary);">
      Already have an account?
      <a href="login.html" style="font-weight: 600; color: var(--primary);">Sign in</a>
    </div>

    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
      <button class="btn btn-icon btn-outline btn-sm" onclick="UI.toggleTheme()" title="Toggle Theme" style="margin: 0 auto;">
        <i data-lucide="moon" style="width: 15px; height: 15px;"></i>
      </button>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    lucide.createIcons();

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const workspaceName = document.getElementById('workspaceName').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;

      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const res = await API.post('/auth/register', {
          full_name: fullName,
          email,
          workspace_name: workspaceName,
          role,
          password
        });

        if (res.data && res.data.session && res.data.session.access_token) {
          Auth.saveSession(res.data);
          UI.toast('Workspace created successfully!', 'success');
          setTimeout(() => {
            window.location.replace('dashboard.html');
          }, 500);
        } else {
          // Email confirmation is required by Supabase Auth
          alertBox.className = 'alert-box alert-success';
          alertBox.textContent = 'Account created successfully! Please check your email inbox to verify your account, then sign in.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          btnText.style.display = 'inline';
          btnSpinner.style.display = 'none';
          UI.toast('Account created! Please verify your email before logging in.', 'info');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed. Please try again.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
