<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks & Milestones – ProofDesk</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="app-main">
      <div id="topbar-mount"></div>

      <div class="page-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;">Tasks</h1>
            <p style="font-size: 13.5px; color: var(--text-muted);">Organize execution steps, sprint priorities, and client requests</p>
          </div>
          <button class="btn btn-primary" onclick="openCreateTaskModal()">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Add Task
          </button>
        </div>

        <!-- Filter bar -->
        <div class="card" style="margin-bottom: 24px; padding: 16px 20px;">
          <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 220px;">
              <select id="taskProjectFilter" class="form-select" onchange="filterTasks()">
                <option value="">All Projects</option>
              </select>
            </div>
            <div style="min-width: 160px;">
              <select id="taskStatusFilter" class="form-select" onchange="filterTasks()">
                <option value="">All Statuses</option>
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="in_review">In Review</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div style="min-width: 150px;">
              <select id="taskPriorityFilter" class="form-select" onchange="filterTasks()">
                <option value="">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tasks Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th style="width: 44px;"></th>
                <th>Task Title</th>
                <th>Project</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Status</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <tr>
                <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">
                  Loading tasks...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Create New Task</div>
        <button class="btn btn-icon btn-outline btn-sm" onclick="UI.closeModal('taskModal')">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
      <form id="taskForm" onsubmit="handleSaveTask(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="taskProject">Assign to Project *</label>
            <select id="taskProject" class="form-select" required>
              <option value="">-- Select project --</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="taskTitle">Task Title *</label>
            <input type="text" id="taskTitle" class="form-control" placeholder="e.g. Export 300 DPI print-ready proofs" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="taskDescription">Description</label>
            <textarea id="taskDescription" class="form-textarea" placeholder="Specific guidelines or deliverables..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="taskPriority">Priority</label>
              <select id="taskPriority" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="taskDueDate">Due Date</label>
              <input type="date" id="taskDueDate" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="UI.closeModal('taskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    Auth.requireAuth();

    let allTasks = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await UI.renderLayout('tasks');
      document.getElementById('pageTitleHeading').textContent = 'Tasks';
      await loadProjectsDropdown();
      await loadTasks();
    });

    async function loadProjectsDropdown() {
      try {
        const res = await API.get('/projects');
        const projects = res.data || [];
        const filterSel = document.getElementById('taskProjectFilter');
        const formSel = document.getElementById('taskProject');

        filterSel.innerHTML = '<option value="">All Projects</option>' +
          projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        formSel.innerHTML = '<option value="">-- Select project --</option>' +
          projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      } catch (err) {
        console.error('Failed to load projects:', err);
      }
    }

    async function loadTasks() {
      try {
        const res = await API.get('/tasks');
        allTasks = res.data || [];
        renderTasksTable(allTasks);
      } catch (err) {
        console.error('Failed to load tasks:', err);
        UI.toast('Failed to load tasks: ' + err.message, 'error');
      }
    }

    function filterTasks() {
      const projId = document.getElementById('taskProjectFilter').value;
      const status = document.getElementById('taskStatusFilter').value;
      const priority = document.getElementById('taskPriorityFilter').value;

      const filtered = allTasks.filter(t => {
        const matchesProj = !projId || t.project_id === projId;
        const matchesStatus = !status || t.status === status;
        const matchesPriority = !priority || t.priority === priority;
        return matchesProj && matchesStatus && matchesPriority;
      });

      renderTasksTable(filtered);
    }

    function renderTasksTable(tasks) {
      const tbody = document.getElementById('tasksTableBody');
      if (tasks.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <div class="empty-state-icon"><i data-lucide="check-square"></i></div>
                <div class="empty-state-title">No tasks found</div>
                <div class="empty-state-desc">Break project deliverables down into clear, assignable action items.</div>
                <button class="btn btn-primary" onclick="openCreateTaskModal()">Add Task</button>
              </div>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = tasks.map(t => {
        const projName = t.projects ? t.projects.name : 'Unknown';
        const isDone = t.status === 'done';

        return `
          <tr>
            <td>
              <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTaskDone('${t.id}', this.checked)" style="cursor: pointer; width: 16px; height: 16px;">
            </td>
            <td>
              <div style="font-weight: 600; text-decoration: ${isDone ? 'line-through' : 'none'}; color: ${isDone ? 'var(--text-muted)' : 'var(--text-main)'}; font-size: 14px;">
                ${t.title}
              </div>
              ${t.description ? `<div style="font-size: 12px; color: var(--text-muted);">${t.description}</div>` : ''}
            </td>
            <td>
              <a href="project-details.html?id=${t.project_id}" style="color: var(--primary); font-weight: 600;">
                ${projName}
              </a>
            </td>
            <td><span class="badge badge-muted">${t.priority}</span></td>
            <td>${UI.formatDate(t.due_date)}</td>
            <td>${UI.renderStatusBadge(t.status)}</td>
            <td style="text-align: right;">
              <button class="btn btn-icon btn-outline btn-sm" onclick="deleteTask('${t.id}')" title="Delete Task">
                <i data-lucide="trash-2" style="width: 14px; height: 14px; color: var(--danger);"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    function openCreateTaskModal() {
      document.getElementById('taskForm').reset();
      UI.openModal('taskModal');
    }

    async function handleSaveTask(e) {
      e.preventDefault();
      const project_id = document.getElementById('taskProject').value;
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDescription').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const due_date = document.getElementById('taskDueDate').value || null;

      try {
        await API.post('/tasks', {
          project_id,
          title,
          description,
          priority,
          due_date,
          status: 'todo'
        });
        UI.toast('Task created successfully', 'success');
        UI.closeModal('taskModal');
        await loadTasks();
      } catch (err) {
        UI.toast('Failed to create task: ' + err.message, 'error');
      }
    }

    async function toggleTaskDone(taskId, isDone) {
      try {
        await API.put(`/tasks/${taskId}`, {
          status: isDone ? 'done' : 'todo'
        });
        await loadTasks();
      } catch (err) {
        UI.toast('Failed to update task: ' + err.message, 'error');
      }
    }

    async function deleteTask(taskId) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        await API.delete(`/tasks/${taskId}`);
        UI.toast('Task deleted', 'success');
        await loadTasks();
      } catch (err) {
        UI.toast('Failed to delete task: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
